[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-computing-teaching-labs"
version = "0.1.0"
description = "Qiskit 2.x teaching laboratories for quantum computing and structured data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luke James Miller", email = "luke@lukejamesmiller.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
